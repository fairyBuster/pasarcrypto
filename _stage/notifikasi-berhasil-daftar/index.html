<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generated Page</title>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
  <style id="sections-styles">
/* CSS for section section:NotificationModal */
#section-notification-modal {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  width: 100%;
}

.app-container {
  width: 100%;
  max-width: 412px;
  height: 100vh;
  max-height: 917px;
  position: relative;
  background: linear-gradient(180deg, #0c1a2d 0%, #13263d 38%, #0f2036 70%, #0a1626 100%);
  overflow: hidden;
  box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
}

.modal-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(4, 9, 18, 0.85);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 0 24px;
  z-index: 10;
}

.modal-content {
  background: linear-gradient(135deg, #1d3350 0%, #14263d 100%);
  border-radius: 20px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  max-width: 364px;
}

.modal-header {
  display: flex;
  align-items: center;
  gap: 12px;
}

.icon-wrapper {
  width: 40px;
  height: 40px;
  border-radius: 20px;
  background: linear-gradient(135deg, #f5f8fa 0%, #c9d4e1 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  flex-shrink: 0;
}

.icon-wrapper img {
  width: 18px;
  height: 18px;
  display: block;
}

.modal-title {
  color: #ffffff;
  font-size: 16px;
  font-weight: 700;
  margin: 0;
  line-height: 1.2;
}

.modal-body {
  display: flex;
  flex-direction: column;
}

.modal-description {
  color: #a9b7c8;
  font-size: 14px;
  line-height: 1.4;
  margin: 0;
}

.modal-footer {
  display: flex;
  justify-content: flex-end;
  padding-top: 4px;
}

.btn-close {
  background: linear-gradient(135deg, #f5f8fa 0%, #c9d4e1 100%);
  border-radius: 18px;
  padding: 0 22px;
  height: 36px;
  display: flex;
  justify-content: center;
  align-items: center;
  border: none;
  cursor: pointer;
  color: #0c1a2d;
  font-size: 14px;
  font-weight: 700;
  font-family: inherit;
  transition: opacity 0.2s ease;
}

.btn-close:hover {
  opacity: 0.9;
}

.btn-close:active {
  opacity: 0.8;
}

/* Responsive adjustments for smaller screens */
@media (max-width: 360px) {
  .modal-overlay {
    padding: 0 16px;
  }
  
  .modal-content {
    padding: 16px;
  }
}
  </style>
</head>
<body>
<section id="section-notification-modal">
  <div class="app-container">
    <div class="modal-overlay">
      <div class="modal-content">
        
        <div class="modal-header">
          <div class="icon-wrapper">
            <img src="images/8_920.svg" alt="Success Icon">
          </div>
          <h2 class="modal-title">Pendaftaran Berhasil!</h2>
        </div>

        <div class="modal-body">
          <p class="modal-description">
            Selamat, akunmu sudah berhasil dibuat. Silakan masuk untuk mulai menggunakan aplikasi.
          </p>
        </div>

        <div class="modal-footer">
          <button class="btn-close" type="button">Tutup</button>
        </div>

      </div>
    </div>
  </div>
</section>
</body>
</html>
