<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generated Page</title>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
  <style id="sections-styles">
/* CSS for section section:Modal */
#section-modal {
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
}

.mobile-frame {
  width: 100%;
  max-width: 412px;
  height: 100vh;
  max-height: 917px;
  position: relative;
  background: linear-gradient(180deg, #0c1a2d 0%, #13263d 38%, #0f2036 70%, #0a1626 100%);
  overflow: hidden;
  box-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
}

.overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(4, 9, 18, 0.85);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 0 24px;
  box-sizing: border-box;
}

.modal-card {
  width: 100%;
  max-width: 364px;
  background: linear-gradient(180deg, #1c334f 0%, #14263d 100%);
  border-radius: 20px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  box-sizing: border-box;
}

.modal-header {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 12px;
}

.icon-container {
  width: 40px;
  height: 40px;
  border-radius: 20px;
  background: linear-gradient(180deg, #f5f8fa 0%, #c9d4e0 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  flex-shrink: 0;
}

.alert-icon {
  width: 18px;
  height: 18px;
  display: block;
}

.title-container {
  display: flex;
  flex-direction: column;
}

.modal-title {
  margin: 0;
  color: #ffffff;
  font-size: 16px;
  font-weight: 700;
  line-height: 1.4;
}

.modal-body {
  display: flex;
  flex-direction: column;
}

.modal-description {
  margin: 0;
  color: #a9b7c8;
  font-size: 14px;
  line-height: 1.5;
  font-weight: 400;
}

.modal-footer {
  display: flex;
  flex-direction: row;
  justify-content: flex-end;
  padding-top: 4px;
}

.btn-primary {
  background: linear-gradient(180deg, #f5f8fa 0%, #c9d4e0 100%);
  border-radius: 18px;
  padding: 0 22px;
  height: 36px;
  border: none;
  color: #0c1a2d;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  justify-content: center;
  align-items: center;
  transition: opacity 0.2s ease;
}

.btn-primary:hover {
  opacity: 0.9;
}
  </style>
  <script src="global.js" defer></script>
</head>
<body>
<section id="section-modal">
  <div class="mobile-frame">
    <div class="overlay">
      <div class="modal-card">
        <div class="modal-header">
          <div class="icon-container">
            <img src="images/8_955.svg" alt="Alert Icon" class="alert-icon">
          </div>
          <div class="title-container">
            <h2 class="modal-title">Nomor Tidak Terdaftar</h2>
          </div>
        </div>
        <div class="modal-body">
          <p class="modal-description">Nomor ponsel yang kamu masukkan belum terdaftar. Periksa kembali nomornya, atau daftar akun baru terlebih dahulu.</p>
        </div>
        <div class="modal-footer">
          <button class="btn-primary">Tutup</button>
        </div>
      </div>
    </div>
  </div>
</section>
</body>
</html>
