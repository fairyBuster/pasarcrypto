<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generated Page</title>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
  <style id="sections-styles">
/* CSS for section section:Modal */
.modal-section {
  position: relative;
  width: 100%;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background:
    radial-gradient(circle at 69% -4%, rgba(78, 108, 142, 0.55) 0%, rgba(78, 108, 142, 0) 100%),
    radial-gradient(circle at 60% 38%, rgba(44, 72, 104, 0.45) 0%, rgba(44, 72, 104, 0) 100%),
    linear-gradient(180deg, #0c1a2d 0%, #13263d 38%, #0f2036 70%, #0a1626 100%);
  overflow: hidden;
}

.modal-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(4, 9, 18, 0.85);
  z-index: 1;
}

.modal-container {
  position: relative;
  z-index: 2;
  width: 100%;
  padding: 24px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.modal-box {
  width: 100%;
  max-width: 364px;
  background: linear-gradient(180deg, #1d3350 0%, #14263d 100%);
  border-radius: 20px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.modal-header {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 12px;
}

.icon-container {
  width: 40px;
  height: 40px;
  border-radius: 20px;
  background: linear-gradient(180deg, #f5f8fb 0%, #c9d4e1 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  flex-shrink: 0;
}

.icon-container img {
  width: 18px;
  height: 18px;
  display: block;
}

.title-container {
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.modal-title {
  margin: 0;
  color: #ffffff;
  font-size: 16px;
  font-weight: 700;
  line-height: 1.4;
}

.modal-body {
  display: flex;
  flex-direction: column;
  width: 100%;
}

.modal-description {
  margin: 0;
  color: #a9b7c8;
  font-size: 14px;
  font-weight: 400;
  line-height: 1.4;
}

.modal-footer {
  display: flex;
  flex-direction: row;
  justify-content: flex-end;
  padding-top: 4px;
  width: 100%;
}

.modal-button {
  height: 36px;
  padding: 0 22px;
  border-radius: 18px;
  background: linear-gradient(180deg, #f5f8fb 0%, #c9d4e1 100%);
  border: none;
  cursor: pointer;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #0c1a2d;
  font-size: 14px;
  font-weight: 700;
  font-family: inherit;
  transition: opacity 0.2s ease;
}

.modal-button:hover {
  opacity: 0.9;
}

/* Responsive adjustments */
@media (max-width: 480px) {
  .modal-box {
    padding: 16px;
  }
  
  .modal-title {
    font-size: 15px;
  }
  
  .modal-description {
    font-size: 13px;
  }
}
  </style>
  <script src="global.js" defer></script>
</head>
<body>
<section id="section-modal" class="modal-section">
  <div class="modal-overlay"></div>
  <div class="modal-container">
    <div class="modal-box">
      <div class="modal-header">
        <div class="icon-container">
          <img src="images/8_1025.svg" alt="Alert Icon">
        </div>
        <div class="title-container">
          <h2 class="modal-title">Saldo Tidak Mencukupi</h2>
        </div>
      </div>
      <div class="modal-body">
        <p class="modal-description">Saldo kamu belum cukup untuk melanjutkan transaksi ini. Silakan isi saldo terlebih dahulu, lalu coba lagi.</p>
      </div>
      <div class="modal-footer">
        <button class="modal-button">Tutup</button>
      </div>
    </div>
  </div>
</section>
</body>
</html>
