<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generated Page</title>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
  <style id="sections-styles">
/* CSS for section section:Header */
.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 16px 0;
    width: 100%;
  }
  .back-btn {
    width: 40px;
    height: 40px;
    border-radius: 20px;
    background-color: #1f3048;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    transition: background-color 0.2s;
  }
  .back-btn:hover {
    background-color: #2a4060;
  }
  .back-btn img {
    width: 20px;
    height: 20px;
  }
  .header-title {
    color: #ffffff;
    font-size: 16px;
    font-weight: 600;
    margin: 0;
    text-align: center;
    flex: 1;
  }
  .header-placeholder {
    width: 40px;
    height: 40px;
  }

/* CSS for section section:Deposit */
.deposit-container {
    padding: 22px 16px 0;
    display: flex;
    flex-direction: column;
    width: 100%;
  }
  .deposit-label {
    color: #ffffff;
    font-size: 14px;
    margin-bottom: 10px;
  }
  .deposit-input-wrapper {
    background-color: #1f3048;
    border: 1px solid #5a82bf;
    border-radius: 18px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    margin-bottom: 12px;
  }
  .deposit-amount {
    color: #ffffff;
    font-size: 24px;
    font-weight: 700;
  }
  .deposit-currency {
    color: #a9b7c8;
    font-size: 14px;
    font-weight: 600;
  }
  .quick-amounts {
    display: flex;
    gap: 8px;
    width: 100%;
  }
  .amount-btn {
    background-color: #1f3048;
    color: #d3dce7;
    border: none;
    border-radius: 19px;
    height: 38px;
    padding: 0;
    font-size: 13px;
    flex: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
    transition: all 0.2s;
  }
  .amount-btn:hover:not(.active) {
    background-color: #2a4060;
  }
  .amount-btn.active {
    background: linear-gradient(180deg, #f5f8fb 0%, #c7d4e1 100%);
    color: #0c1a2d;
    font-weight: 700;
  }

/* CSS for section section:Info */
.info-container {
    padding: 16px 16px 0;
    width: 100%;
  }
  .info-box {
    background-color: #16263c;
    border-radius: 16px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .info-item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }
  .bullet-container {
    padding-top: 6px;
  }
  .bullet {
    width: 5px;
    height: 5px;
    background-color: #8597ab;
    border-radius: 3px;
  }
  .info-text {
    color: #d3dce7;
    font-size: 12px;
    margin: 0;
    line-height: 1.5;
  }
  .info-text strong {
    font-weight: 700;
    color: #ffffff;
  }

/* CSS for section section:Action */
.action-container {
    padding: 20px 16px 0;
    width: 100%;
  }
  .btn-primary {
    width: 100%;
    height: 52px;
    border-radius: 26px;
    background: linear-gradient(180deg, #f5f8fb 0%, #c7d4e1 100%);
    color: #0c1a2d;
    border: none;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: opacity 0.2s;
  }
  .btn-primary:hover {
    opacity: 0.9;
  }

/* CSS for section section:Security */
.security-container {
    padding: 16px 16px 24px;
    width: 100%;
    margin-top: 24px;
  }
  .security-banner {
    background: linear-gradient(90deg, #1d3656 0%, #162a44 100%);
    border-radius: 16px;
    display: flex;
    align-items: center;
    padding: 16px 16px 16px 100px;
    position: relative;
    min-height: 91px;
  }
  .security-icon {
    position: absolute;
    left: 16px;
    top: -6px;
    width: 74px;
    height: 97px;
    object-fit: contain;
    z-index: 1;
  }
  .security-text-content {
    display: flex;
    flex-direction: column;
    gap: 4px;
    position: relative;
    z-index: 2;
  }
  .security-title {
    color: #ffffff;
    font-size: 13px;
    margin: 0;
    font-weight: 700;
  }
  .security-desc {
    color: #a9b7c8;
    font-size: 11px;
    margin: 0;
    line-height: 1.4;
  }
  </style>
  <script src="global.js" defer></script>
</head>
<body>
<section id="section-header">
  <header class="header">
    <button class="back-btn" aria-label="Go back">
      <img src="images/29_190.svg" alt="">
    </button>
    <h1 class="header-title">BRI Virtual Account</h1>
    <div class="header-placeholder"></div>
  </header>
</section>
<section id="section-deposit">
  <div class="deposit-container">
    <label class="deposit-label">Total Penyetoran</label>
    <div class="deposit-input-wrapper">
      <span class="deposit-amount">100.000</span>
      <span class="deposit-currency">IDR</span>
    </div>
    <div class="quick-amounts">
      <button class="amount-btn">50.000</button>
      <button class="amount-btn active">100.000</button>
      <button class="amount-btn">500.000</button>
      <button class="amount-btn">1.000.000</button>
    </div>
  </div>
</section>
<section id="section-info">
  <div class="info-container">
    <div class="info-box">
      <div class="info-item">
        <div class="bullet-container">
          <div class="bullet"></div>
        </div>
        <p class="info-text">Minimum isi ulang <strong>50.000 IDR</strong>, maksimum<br><strong>50.000.000 IDR</strong></p>
      </div>
      <div class="info-item">
        <div class="bullet-container">
          <div class="bullet"></div>
        </div>
        <p class="info-text"><strong>Tanpa biaya layanan</strong> untuk setiap isi ulang</p>
      </div>
    </div>
  </div>
</section>
<section id="section-action">
  <div class="action-container">
    <button class="btn-primary">Selanjutnya</button>
  </div>
</section>
<section id="section-security">
  <div class="security-container">
    <div class="security-banner">
      <img src="images/9e084c1e66c50a13dd89f5e20ace83590121dc6b.png" alt="Security Shield" class="security-icon">
      <div class="security-text-content">
        <h3 class="security-title">Pembayaran aman & terlindungi</h3>
        <p class="security-desc">Diproses oleh mitra pembayaran pihak ketiga resmi. Data dan transaksimu terenkripsi.</p>
      </div>
    </div>
  </div>
</section>
</body>
</html>
