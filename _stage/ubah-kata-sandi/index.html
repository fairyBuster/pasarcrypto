<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generated Page</title>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
  <style id="sections-styles">
/* CSS for section section:Header */
.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 16px 0;
    height: 60px;
  }
  .back-btn {
    width: 40px;
    height: 40px;
    border-radius: 20px;
    background-color: #1f3048;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .page-title {
    color: #ffffff;
    font-size: 16px;
    font-weight: 600;
    text-align: center;
    flex: 1;
  }
  .header-spacer {
    width: 40px;
  }

/* CSS for section section:Info */
.info-box {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 20px 16px 0;
  }
  .info-icon {
    padding-top: 2px;
  }
  .info-text {
    color: #a9b7c8;
    font-size: 12px;
    line-height: 1.5;
  }

/* CSS for section section:Form */
.form-section {
    padding: 0 16px 28px;
  }
  .form-group {
    padding-top: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .form-label {
    color: #d3dce7;
    font-size: 12px;
    font-weight: 500;
    display: flex;
    gap: 2px;
  }
  .asterisk {
    color: #f2667a;
  }
  .input-wrapper {
    background-color: #1f3048;
    border: 1px solid #2f4560;
    border-radius: 14px;
    height: 46px;
    display: flex;
    align-items: center;
    padding: 0 14px;
    justify-content: space-between;
  }
  .input-wrapper.active {
    border-color: #8fa1b6;
  }
  .form-input {
    background: transparent;
    border: none;
    color: #ffffff;
    font-size: 14px;
    outline: none;
    flex: 1;
    font-family: inherit;
    letter-spacing: 4px;
  }
  .form-input.placeholder-style {
    color: #75879c;
    letter-spacing: normal;
  }
  .form-input::placeholder {
    color: #75879c;
    letter-spacing: normal;
  }
  .icon-btn {
    background: transparent;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .forgot-password-container {
    padding-top: 12px;
    display: flex;
    justify-content: flex-end;
  }
  .forgot-password {
    color: #c9d4e1;
    font-size: 12px;
    text-decoration: none;
  }
  .password-strength {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 8px;
  }
  .strength-bars {
    display: flex;
    gap: 4px;
    width: 277px;
  }
  .bar {
    height: 4px;
    border-radius: 2px;
    flex: 1;
  }
  .bar.filled-medium {
    background-color: #e9c46a;
  }
  .bar.empty {
    background-color: #22344b;
  }
  .strength-text {
    color: #e9c46a;
    font-size: 10px;
    font-weight: 600;
  }
  .text-muted {
    color: #8597ab;
    font-weight: 400;
  }
  .requirements-container {
    padding-top: 14px;
  }
  .requirements-box {
    background-color: rgba(31, 48, 72, 0.45);
    border-radius: 14px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .requirements-title {
    color: #d3dce7;
    font-size: 12px;
    font-weight: 500;
    margin: 0;
  }
  .requirements-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin: 0;
    padding: 0;
  }
  .requirement-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
  }
  .requirement-item.valid {
    color: #d3dce7;
  }
  .requirement-item.invalid {
    color: #8597ab;
  }
  .check-icon {
    width: 16px;
    height: 16px;
    background-color: #3ecf8e;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .uncheck-icon {
    width: 16px;
    height: 16px;
    border: 1px solid #51657e;
    border-radius: 8px;
    box-sizing: border-box;
  }
  .submit-container {
    padding-top: 24px;
  }
  .submit-btn {
    width: 100%;
    height: 44px;
    border-radius: 22px;
    background: linear-gradient(180deg, #f5f8fb 0%, #c9d4e1 100%);
    border: none;
    color: #0c1a2d;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  </style>
  <script src="global.js" defer></script>
</head>
<body>
<section id="section-header">
  <header class="header">
    <button class="back-btn" aria-label="Go back">
      <img src="images/93_298.svg" alt="Back">
    </button>
    <h1 class="page-title">Ubah Kata Sandi</h1>
    <div class="header-spacer"></div>
  </header>
</section>
<section id="section-info">
  <div class="info-box">
    <div class="info-icon">
      <img src="images/93_306.svg" alt="Security Info">
    </div>
    <p class="info-text">Demi keamanan, jangan bagikan kata sandi kamu kepada siapa pun, termasuk tim kami.</p>
  </div>
</section>
<section id="section-form" class="form-section">
  <form>
    <!-- Old Password -->
    <div class="form-group">
      <label class="form-label">Kata sandi lama <span class="asterisk">*</span></label>
      <div class="input-wrapper">
        <input type="password" class="form-input" value="12345678" readonly>
        <button type="button" class="icon-btn" aria-label="Toggle visibility">
          <img src="images/93_319.svg" alt="Hide password">
        </button>
      </div>
    </div>

    <!-- Forgot Password -->
    <div class="forgot-password-container">
      <a href="#" class="forgot-password">Lupa kata sandi?</a>
    </div>

    <!-- New Password -->
    <div class="form-group">
      <label class="form-label">Kata sandi baru <span class="asterisk">*</span></label>
      <div class="input-wrapper active">
        <input type="password" class="form-input" value="12345678" readonly>
        <button type="button" class="icon-btn" aria-label="Toggle visibility">
          <img src="images/93_334.svg" alt="Hide password">
        </button>
      </div>
      <div class="password-strength">
        <div class="strength-bars">
          <div class="bar filled-medium"></div>
          <div class="bar filled-medium"></div>
          <div class="bar empty"></div>
        </div>
        <span class="strength-text"><span class="text-muted">Kekuatan:</span> Sedang</span>
      </div>
    </div>

    <!-- Requirements -->
    <div class="requirements-container">
      <div class="requirements-box">
        <h3 class="requirements-title">Kata sandi harus memiliki:</h3>
        <ul class="requirements-list">
          <li class="requirement-item valid">
            <div class="check-icon"><img src="images/93_351.svg" alt="Valid"></div>
            <span>Minimal 8 karakter</span>
          </li>
          <li class="requirement-item valid">
            <div class="check-icon"><img src="images/93_356.svg" alt="Valid"></div>
            <span>Huruf besar dan huruf kecil</span>
          </li>
          <li class="requirement-item valid">
            <div class="check-icon"><img src="images/93_361.svg" alt="Valid"></div>
            <span>Minimal 1 angka</span>
          </li>
          <li class="requirement-item invalid">
            <div class="uncheck-icon"></div>
            <span>Berbeda dari kata sandi lama</span>
          </li>
        </ul>
      </div>
    </div>

    <!-- Confirm Password -->
    <div class="form-group">
      <label class="form-label">Konfirmasi kata sandi baru <span class="asterisk">*</span></label>
      <div class="input-wrapper">
        <input type="password" class="form-input placeholder-style" placeholder="Ulangi kata sandi baru" readonly>
        <button type="button" class="icon-btn" aria-label="Toggle visibility">
          <img src="images/93_375.svg" alt="Show password">
        </button>
      </div>
    </div>

    <!-- Submit -->
    <div class="submit-container">
      <button type="submit" class="submit-btn">Simpan Kata Sandi</button>
    </div>
  </form>
</section>
</body>
</html>
