<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generated Page</title>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
  <style id="sections-styles">
/* CSS for section section:ConfirmationModal */
.app-container {
    width: 100%;
    max-width: 412px; /* Based on Figma root frame width */
    background-color: #131313;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    min-height: 100vh;
  }

  .modal-card {
    width: 100%;
    max-width: 320px;
    /* Combined radial and linear gradients to match design */
    background: 
      radial-gradient(circle at 50% 0%, rgba(127, 170, 230, 0.22) 0%, rgba(127, 170, 230, 0) 60%),
      linear-gradient(180deg, #24426a 0%, #1a3150 55%, #12233a 100%);
    border-radius: 24px;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .modal-header {
    text-align: center;
    margin-bottom: 24px;
  }

  .modal-title {
    color: #ffffff;
    font-size: 16px;
    font-weight: 600;
    margin: 0 0 8px 0;
    letter-spacing: 0.2px;
  }

  .modal-subtitle {
    color: #a9b7c8;
    font-size: 12px;
    line-height: 1.5;
    margin: 0;
  }

  .amount-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 32px;
    gap: 4px;
  }

  .amount-label {
    color: #a9b7c8;
    font-size: 12px;
  }

  .amount-value-container {
    display: flex;
    align-items: baseline;
    gap: 6px;
  }

  .amount-value {
    color: #ffffff;
    font-size: 28px;
    font-weight: 700;
  }

  .amount-currency {
    color: #a9b7c8;
    font-size: 12px;
    font-weight: 600;
  }

  .details-list {
    width: 100%;
    display: flex;
    flex-direction: column;
    margin-bottom: 32px;
    border-top: 1px solid rgba(201, 212, 225, 0.18);
    border-bottom: 1px solid rgba(201, 212, 225, 0.18);
  }

  .detail-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid rgba(201, 212, 225, 0.18);
  }

  .detail-row:last-child {
    border-bottom: none;
  }

  .detail-label {
    color: #a9b7c8;
    font-size: 13px;
  }

  .detail-value {
    color: #ffffff;
    font-size: 13px;
    font-weight: 600;
  }

  .action-buttons {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .btn-primary {
    width: 100%;
    height: 44px;
    border-radius: 22px;
    background: linear-gradient(180deg, #f5f8fb 0%, #c9d4e1 100%);
    color: #0c1a2d;
    font-size: 14px;
    font-weight: 700;
    border: none;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: inherit;
  }

  .btn-secondary {
    background: transparent;
    border: none;
    color: #a9b7c8;
    font-size: 13px;
    font-weight: 400;
    cursor: pointer;
    padding: 8px;
    font-family: inherit;
  }
  </style>
  <script src="global.js" defer></script>
</head>
<body>
<section id="section-confirmation-modal" class="app-container">
  <div class="modal-card">
    
    <header class="modal-header">
      <h2 class="modal-title">Konfirmasi Penarikan</h2>
      <p class="modal-subtitle">Pastikan data di bawah ini sudah benar sebelum<br>melanjutkan.</p>
    </header>

    <div class="amount-section">
      <span class="amount-label">Nominal penarikan</span>
      <div class="amount-value-container">
        <span class="amount-value">1.000.000</span>
        <span class="amount-currency">IDR</span>
      </div>
    </div>

    <div class="details-list">
      <div class="detail-row">
        <span class="detail-label">Nama rekening</span>
        <span class="detail-value">Us****me</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Nomor rekening</span>
        <span class="detail-value">7810 **** 9031</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Bank</span>
        <span class="detail-value">BRI</span>
      </div>
    </div>

    <div class="action-buttons">
      <button class="btn-primary">Ya, Tarik Sekarang</button>
      <button class="btn-secondary">Batal</button>
    </div>

  </div>
</section>
</body>
</html>
