<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generated Page</title>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
  <style id="sections-styles">
/* CSS for section section:Notification */
.notification-section {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
  background-color: #040404;
}

.modal-card {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  max-width: 312px;
  padding: 20px;
  border-radius: 20px;
  background: linear-gradient(180deg, #1D3350 0%, #14263D 100%);
}

.modal-header {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 12px;
}

.icon-wrapper {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 40px;
  height: 40px;
  border-radius: 20px;
  background: linear-gradient(180deg, #F5F8FB 0%, #C9D4E1 100%);
  flex-shrink: 0;
}

.success-icon {
  width: 18px;
  height: 18px;
  display: block;
}

.title-wrapper {
  display: flex;
  flex-direction: column;
}

.modal-title {
  margin: 0;
  color: #ffffff;
  font-size: 16px;
  font-weight: 700;
  line-height: 1.2;
}

.modal-body {
  display: flex;
  flex-direction: column;
}

.modal-description {
  margin: 0;
  color: rgba(255, 255, 255, 0.7);
  font-size: 14px;
  line-height: 1.4;
}

.modal-description strong {
  color: #ffffff;
  font-weight: 600;
}

.modal-footer {
  display: flex;
  flex-direction: row;
  justify-content: flex-end;
  padding-top: 4px;
}

.btn-close {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 36px;
  padding: 0 22px;
  border-radius: 18px;
  background: linear-gradient(180deg, #F5F8FB 0%, #C9D4E1 100%);
  border: none;
  color: #0c1a2d;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: opacity 0.2s ease;
}

.btn-close:hover {
  opacity: 0.9;
}
  </style>
  <script src="global.js" defer></script>
</head>
<body>
<section id="section-notification" class="notification-section">
  <div class="modal-card">
    <div class="modal-header">
      <div class="icon-wrapper">
        <img src="images/49_160.svg" alt="Success Icon" class="success-icon">
      </div>
      <div class="title-wrapper">
        <h2 class="modal-title">Kamu Dapat Hadiah!</h2>
      </div>
    </div>
    <div class="modal-body">
      <p class="modal-description">Bonus saldo sebesar <strong>50.000 IDR</strong> sudah<br>masuk ke Saldo Tersedia.</p>
    </div>
    <div class="modal-footer">
      <button class="btn-close">Tutup</button>
    </div>
  </div>
</section>
</body>
</html>
