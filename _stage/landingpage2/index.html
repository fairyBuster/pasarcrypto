<!DOCTYPE html>

<head>

  <link rel="stylesheet" href="global.css">
  <style id="sections-styles">
/* CSS for section section:Header */
.site-header {
    display: flex;
    justify-content: flex-end;
    padding: 16px;
  }
  .close-btn {
    background-color: #1f3048;
    border: none;
    border-radius: 16px;
    width: 32px;
    height: 32px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: background-color 0.2s;
  }
  .close-btn:hover {
    background-color: #2a405f;
  }

/* CSS for section section:Navigation */
.main-nav {
    padding: 0 16px;
    margin-top: 6px;
  }
  .nav-list {
    display: flex;
    flex-direction: column;
  }
  .nav-item {
    border-bottom: 1px solid #1c2d44;
  }
  .nav-link {
    display: flex;
    align-items: center;
    padding: 12px 0;
    width: 100%;
    cursor: pointer;
  }
  .nav-icon {
    width: 36px;
    height: 36px;
    border-radius: 18px;
    background-color: #1f3048;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-right: 12px;
    flex-shrink: 0;
  }
  .active-icon {
    background: linear-gradient(180deg, #f5f8fb 0%, #c9d4e1 100%);
  }
  .nav-text {
    color: #ffffff;
    font-size: 14px;
    font-weight: 500;
    flex-grow: 1;
  }
  .nav-arrow {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }

/* CSS for section section:Actions */
.actions-wrapper {
    padding: 24px 16px 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 24px;
  }
  .btn {
    width: 100%;
    height: 48px;
    border-radius: 24px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: opacity 0.2s;
  }
  .btn:hover {
    opacity: 0.9;
  }
  .btn-primary {
    background: linear-gradient(180deg, #f5f8fb 0%, #c9d4e1 100%);
    border: none;
    color: #0c1a2d;
  }
  .btn-secondary {
    background-color: rgba(31, 48, 72, 0.5);
    border: 1px solid rgba(201, 212, 225, 0.3);
    color: #ffffff;
  }

/* CSS for section section:Footer */
.site-footer {
    padding: 40px 16px 28px;
    display: flex;
    flex-direction: column;
  }
  .language-selector {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 54px;
  }
  .lang-label {
    color: #a9b7c8;
    font-size: 14px;
  }
  .lang-dropdown {
    background-color: #1f3048;
    border: none;
    border-radius: 16px;
    height: 32px;
    padding: 0 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }
  .lang-text {
    color: #e6ecf3;
    font-size: 13px;
  }
  .footer-links {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .footer-link {
    color: #75879c;
    font-size: 12px;
    transition: color 0.2s;
  }
  .footer-link:hover {
    color: #a9b7c8;
  }
  </style>
  <script src="global.js" defer></script>
</head>
