  <style id="sections-styles">
/* CSS for section section:Welcome */
#section-welcome {
  width: 100%;
  display: flex;
  justify-content: center;
}

.app-container {
  width: 100%;
  max-width: 412px;
  height: 100vh;
  max-height: 917px;
  background-image: url('images/e044d4e570e3749113fd68fd9b07a1a637e4137d.png');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  position: relative;
  overflow: hidden;
  box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
}

.content-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 24px 40px 24px;
  gap: 6px;
  text-align: center;
  width: 100%;
  z-index: 1;
}

.heading-container {
  width: 100%;
  display: flex;
  justify-content: center;
}

.heading {
  color: #ffffff;
  font-size: 24px;
  font-weight: 700;
  margin: 0;
  line-height: 1.2;
}

.subtitle-container {
  width: 100%;
  max-width: 280px;
  display: flex;
  justify-content: center;
}

.subtitle {
  color: #a9b7c8;
  font-size: 14px;
  margin: 0;
  line-height: 1.5;
}

.button-container {
  width: 100%;
  padding-top: 4px;
  display: flex;
  justify-content: center;
}

.btn-primary {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  max-width: 364px;
  height: 52px;
  border-radius: 26px;
  background: linear-gradient(180deg, #625853 0%, #bdac9f 46.63%, #686868 100%);
  color: #ffffff;
  font-weight: 700;
  font-size: 16px;
  text-decoration: none;
  border: none;
  cursor: pointer;
  transition: opacity 0.2s ease, transform 0.1s ease;
}

.btn-primary:hover {
  opacity: 0.9;
}

.btn-primary:active {
  transform: scale(0.98);
}

.login-container {
  width: 100%;
  padding-top: 14px;
  display: flex;
  justify-content: center;
}

.login-text {
  color: #ffffff;
  font-size: 14px;
  margin: 0;
}

.login-link {
  color: #ffffff;
  font-weight: 700;
  text-decoration: none;
}

.login-link:hover {
  text-decoration: underline;
}

.terms-container {
  width: 100%;
  max-width: 290px;
  margin-top: 6px;
  display: flex;
  justify-content: center;
}

.terms-text {
  color: #8597ab;
  font-size: 12px;
  margin: 0;
  line-height: 1.5;
}

.terms-text a {
  color: #e6ecf3;
  text-decoration: none;
  font-weight: 600;
}

.terms-text a:hover {
  text-decoration: underline;
}

/* Responsive adjustments for smaller screens */
@media (max-height: 700px) {
  .app-container {
    height: 100vh;
  }
  .content-wrapper {
    padding-bottom: 24px;
  }
}
  </style>
  <script src="global.js" defer></script>

<body>
<section id="section-welcome">
  <div class="app-container">

      </div>
      
      <div class="subtitle-container">
        <p class="subtitle">Daftar sekarang dan mulai dapatkan penghasilan dari koneksimu.</p>
      </div>
      
      <div class="button-container">
        <a href="#" class="btn-primary">Daftar</a>
      </div>
      
      <div class="login-container">
        <p class="login-text">Sudah punya akun? <a href="#" class="login-link">Masuk</a></p>
      </div>
      
      <div class="terms-container">
        <p class="terms-text">
          Dengan mengetuk Daftar, saya menyetujui 
          <a href="#">Syarat Layanan</a> dan <a href="#">Kebijakan Privasi.</a>
        </p>
      </div>
    </div>
  </div>
</section>
