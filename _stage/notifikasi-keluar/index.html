<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generated Page</title>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
  <style id="sections-styles">
/* CSS for section section:Popup */
.popup-overlay {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    width: 100%;
    max-width: 412px;
    margin: 0 auto;
    background-color: #000000;
    padding: 20px;
  }

  .modal-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 320px;
    padding: 22px 20px 18px 20px;
    border-radius: 24px;
    background: radial-gradient(100% 100% at 50% 0%, rgba(127, 170, 230, 0.22) 0%, rgba(127, 170, 230, 0) 100%), 
                linear-gradient(180deg, #24416A 0%, #1A304F 55%, #122138 100%);
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
  }

  .icon-section {
    padding-bottom: 14px;
    display: flex;
    justify-content: center;
    width: 100%;
  }

  .icon-background {
    width: 52px;
    height: 52px;
    border-radius: 26px;
    background-color: rgba(242, 102, 122, 0.14);
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .exit-icon {
    width: 24px;
    height: 24px;
    display: block;
  }

  .text-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }

  .modal-title {
    color: #ffffff;
    font-size: 18px;
    font-weight: 700;
    margin: 0;
    text-align: center;
    line-height: 1.2;
  }

  .modal-desc-wrapper {
    padding-top: 4px;
    width: 100%;
  }

  .modal-desc {
    color: #a9b7c8;
    font-size: 13px;
    line-height: 1.4;
    text-align: center;
    margin: 0;
    padding: 0 4px;
  }

  .action-section {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .primary-btn-wrapper {
    width: 100%;
    padding-top: 20px;
  }

  .btn-primary {
    width: 100%;
    height: 44px;
    border-radius: 22px;
    background: linear-gradient(90deg, #F5F8FB 0%, #C7D4E1 100%);
    color: #0c1a2d;
    font-size: 14px;
    font-weight: 700;
    border: none;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: opacity 0.2s ease;
  }

  .btn-primary:active {
    opacity: 0.8;
  }

  .secondary-btn-wrapper {
    padding-top: 12px;
  }

  .btn-secondary {
    background: transparent;
    border: none;
    color: #a9b7c8;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    padding: 8px 16px;
    transition: color 0.2s ease;
  }

  .btn-secondary:active {
    color: #ffffff;
  }
  </style>
  <script src="global.js" defer></script>
</head>
<body>
<section id="section-popup" class="popup-overlay">
  <div class="modal-container">
    
    <div class="icon-section">
      <div class="icon-background">
        <img src="images/96_982.svg" alt="Exit Icon" class="exit-icon">
      </div>
    </div>

    <div class="text-section">
      <h2 class="modal-title">Keluar dari Akun?</h2>
      <div class="modal-desc-wrapper">
        <p class="modal-desc">Kamu perlu masuk kembali menggunakan nomor HP atau email dan kata sandi untuk mengakses akunmu.</p>
      </div>
    </div>

    <div class="action-section">
      <div class="primary-btn-wrapper">
        <button class="btn-primary">Ya, Keluar</button>
      </div>
      <div class="secondary-btn-wrapper">
        <button class="btn-secondary">Batal</button>
      </div>
    </div>

  </div>
</section>
</body>
</html>
