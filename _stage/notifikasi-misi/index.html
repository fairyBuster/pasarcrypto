<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generated Page</title>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
  <style id="sections-styles">
/* CSS for section section:NotificationModal */
.modal-overlay {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    min-height: 100vh;
    background-color: #000000;
    padding: 20px;
  }

  .modal-container {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 312px;
    padding: 20px;
    border-radius: 20px;
    background: linear-gradient(180deg, #1d3350 0%, #14263d 100%);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
  }

  .modal-header {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 12px;
  }

  .icon-container {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 40px;
    height: 40px;
    border-radius: 20px;
    background: linear-gradient(180deg, #f5f8fb 0%, #c9d4e1 100%);
    flex-shrink: 0;
  }

  .success-icon {
    width: 18px;
    height: 18px;
    display: block;
  }

  .heading-container {
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .modal-title {
    margin: 0;
    color: #ffffff;
    font-size: 16px;
    font-weight: 700;
    line-height: 1.3;
  }

  .modal-body {
    display: flex;
    flex-direction: column;
    width: 100%;
  }

  .modal-text {
    margin: 0;
    color: #94a3b8;
    font-size: 13px;
    line-height: 1.5;
  }

  .modal-text strong {
    color: #ffffff;
    font-weight: 600;
  }

  .modal-footer {
    display: flex;
    flex-direction: row;
    justify-content: flex-end;
    padding-top: 4px;
    width: 100%;
  }

  .close-button {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 36px;
    padding: 0 22px;
    border-radius: 18px;
    background: linear-gradient(180deg, #f5f8fb 0%, #c9d4e1 100%);
    border: none;
    cursor: pointer;
    transition: opacity 0.2s ease;
  }

  .close-button:hover {
    opacity: 0.9;
  }

  .button-text {
    margin: 0;
    color: #0c1a2d;
    font-size: 14px;
    font-weight: 700;
  }
  </style>
  <script src="global.js" defer></script>
</head>
<body>
<section id="notification-modal" class="modal-overlay">
  <div class="modal-container">
    <div class="modal-header">
      <div class="icon-container">
        <img src="images/42_333.svg" alt="Success Icon" class="success-icon">
      </div>
      <div class="heading-container">
        <h2 class="modal-title">Hadiah Berhasil Diklaim</h2>
      </div>
    </div>
    
    <div class="modal-body">
      <p class="modal-text">Bonus misi <strong>3 teman trading</strong> sebesar <strong>100.000 IDR</strong> sudah masuk ke Saldo Tersedia. Ajak lebih banyak teman untuk membuka hadiah berikutnya.</p>
    </div>
    
    <div class="modal-footer">
      <button class="close-button">
        <span class="button-text">Tutup</span>
      </button>
    </div>
  </div>
</section>
</body>
</html>
