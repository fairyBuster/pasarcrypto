<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generated Page</title>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
  <style id="sections-styles">
/* CSS for section section:Header */
#section-header .header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 16px 0;
  gap: 12px;
}
#section-header .back-btn {
  width: 40px;
  height: 40px;
  border-radius: 20px;
  background-color: #1f3048;
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 0;
}
#section-header .back-btn img {
  width: 20px;
  height: 20px;
}
#section-header .title {
  color: #ffffff;
  font-size: 16px;
  font-weight: 600;
  margin: 0;
  text-align: center;
  flex: 1;
}
#section-header .spacer {
  width: 40px;
  height: 40px;
}

/* CSS for section section:Notice */
#section-notice .notice-banner {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 20px 16px 0;
}
#section-notice .notice-icon {
  padding-top: 2px;
  display: flex;
}
#section-notice .notice-icon img {
  width: 16px;
  height: 16px;
}
#section-notice .notice-text {
  color: #a9b7c8;
  font-size: 13px;
  line-height: 1.4;
  margin: 0;
}

/* CSS for section section:FormFields */
#section-form-fields .form-container {
  padding: 16px 16px 0;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
#section-form-fields .form-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
#section-form-fields .form-label {
  display: flex;
  align-items: center;
  gap: 2px;
  color: #d3dce7;
  font-size: 13px;
  font-weight: 500;
}
#section-form-fields .required {
  color: #f2667a;
}
#section-form-fields .optional {
  color: #75879c;
  margin-left: 4px;
  font-weight: 400;
}
#section-form-fields .input-wrapper {
  background-color: #1f3048;
  border: 1px solid #2f4560;
  border-radius: 14px;
  height: 46px;
  display: flex;
  align-items: center;
  padding: 0 14px;
  position: relative;
  transition: border-color 0.2s;
}
#section-form-fields .input-wrapper:focus-within {
  border-color: #5a82bf;
}
#section-form-fields .textarea-wrapper {
  height: 88px;
  align-items: flex-start;
  padding-top: 13px;
  padding-bottom: 13px;
}
#section-form-fields .form-input, 
#section-form-fields .form-select, 
#section-form-fields .form-textarea {
  background: transparent;
  border: none;
  color: #ffffff;
  font-size: 14px;
  width: 100%;
  outline: none;
}
#section-form-fields .form-input::placeholder, 
#section-form-fields .form-textarea::placeholder {
  color: #75879c;
}
#section-form-fields .form-select {
  appearance: none;
  -webkit-appearance: none;
  cursor: pointer;
}
#section-form-fields .form-select:invalid {
  color: #75879c;
}
#section-form-fields .form-select option {
  color: #0c1a2d;
}
#section-form-fields .select-wrapper {
  justify-content: space-between;
}
#section-form-fields .select-icon {
  pointer-events: none;
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  margin-left: 8px;
}
#section-form-fields .form-textarea {
  resize: none;
  height: 100%;
  line-height: 1.4;
}

/* CSS for section section:Preferences */
#section-preferences .preferences-container {
  padding: 20px 16px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
#section-preferences .toggle-info {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: 1;
}
#section-preferences .toggle-title {
  color: #ffffff;
  font-size: 14px;
  font-weight: 500;
}
#section-preferences .toggle-desc {
  color: #8597ab;
  font-size: 12px;
}
#section-preferences .toggle-switch {
  position: relative;
  display: inline-block;
  width: 40px;
  height: 24px;
  flex-shrink: 0;
}
#section-preferences .toggle-input {
  opacity: 0;
  width: 0;
  height: 0;
}
#section-preferences .toggle-track {
  position: absolute;
  cursor: pointer;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: #1f3048;
  transition: .3s;
  border-radius: 12px;
}
#section-preferences .toggle-thumb {
  position: absolute;
  content: "";
  height: 18px;
  width: 18px;
  left: 3px;
  bottom: 3px;
  background-color: #8597ab;
  transition: .3s;
  border-radius: 50%;
}
#section-preferences .toggle-input:checked + .toggle-track {
  background: linear-gradient(90deg, #2c4c80 0%, #5a82bf 100%);
}
#section-preferences .toggle-input:checked ~ .toggle-thumb {
  background-color: #ffffff;
  transform: translateX(16px);
}

/* CSS for section section:Footer */
#section-footer .footer-container {
  padding: 24px 16px 0;
}
#section-footer .btn-primary {
  width: 100%;
  height: 44px;
  border-radius: 22px;
  background: linear-gradient(180deg, #f5f8fb 0%, #c9d4e1 100%);
  color: #0c1a2d;
  font-size: 14px;
  font-weight: 600;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.2s;
}
#section-footer .btn-primary:active {
  opacity: 0.8;
}
  </style>
  <script src="global.js" defer></script>
</head>
<body>
<section id="section-header">
  <header class="header">
    <button class="back-btn" aria-label="Back">
      <img src="images/90_3389.svg" alt="">
    </button>
    <h1 class="title">Alamat Pengiriman</h1>
    <div class="spacer"></div>
  </header>
</section>
<section id="section-notice">
  <div class="notice-banner">
    <div class="notice-icon">
      <img src="images/90_3397.svg" alt="Info">
    </div>
    <p class="notice-text">Pastikan alamat sudah benar agar hadiah barang kamu terkirim tanpa kendala.</p>
  </div>
</section>
<section id="section-form-fields">
  <div class="form-container">
    <div class="form-group">
      <label class="form-label">Label alamat <span class="required">*</span></label>
      <div class="input-wrapper">
        <input type="text" class="form-input" placeholder="Contoh: Rumah, Kantor">
      </div>
    </div>
    
    <div class="form-group">
      <label class="form-label">Nama penerima <span class="required">*</span></label>
      <div class="input-wrapper">
        <input type="text" class="form-input" placeholder="Masukkan nama lengkap penerima">
      </div>
    </div>
    
    <div class="form-group">
      <label class="form-label">Nomor HP penerima <span class="required">*</span></label>
      <div class="input-wrapper">
        <input type="tel" class="form-input" placeholder="Contoh: 0812 3456 7890">
      </div>
    </div>
    
    <div class="form-group">
      <label class="form-label">Provinsi <span class="required">*</span></label>
      <div class="input-wrapper select-wrapper">
        <select class="form-select" required>
          <option value="" disabled selected hidden>Pilih provinsi</option>
          <option value="1">Jawa Barat</option>
          <option value="2">DKI Jakarta</option>
        </select>
        <img src="images/90_3435.svg" alt="" class="select-icon">
      </div>
    </div>
    
    <div class="form-group">
      <label class="form-label">Kota / Kabupaten <span class="required">*</span></label>
      <div class="input-wrapper select-wrapper">
        <select class="form-select" required>
          <option value="" disabled selected hidden>Pilih kota atau kabupaten</option>
          <option value="1">Bandung</option>
          <option value="2">Jakarta Selatan</option>
        </select>
        <img src="images/90_3445.svg" alt="" class="select-icon">
      </div>
    </div>
    
    <div class="form-group">
      <label class="form-label">Kecamatan <span class="required">*</span></label>
      <div class="input-wrapper select-wrapper">
        <select class="form-select" required>
          <option value="" disabled selected hidden>Pilih kecamatan</option>
          <option value="1">Kecamatan A</option>
        </select>
        <img src="images/90_3455.svg" alt="" class="select-icon">
      </div>
    </div>
    
    <div class="form-group">
      <label class="form-label">Kelurahan / Desa <span class="required">*</span></label>
      <div class="input-wrapper select-wrapper">
        <select class="form-select" required>
          <option value="" disabled selected hidden>Pilih kelurahan atau desa</option>
          <option value="1">Kelurahan B</option>
        </select>
        <img src="images/90_3465.svg" alt="" class="select-icon">
      </div>
    </div>
    
    <div class="form-group">
      <label class="form-label">Kode pos <span class="required">*</span></label>
      <div class="input-wrapper">
        <input type="text" class="form-input" placeholder="Masukkan kode pos">
      </div>
    </div>
    
    <div class="form-group">
      <label class="form-label">Alamat lengkap <span class="required">*</span></label>
      <div class="input-wrapper textarea-wrapper">
        <textarea class="form-textarea" placeholder="Nama jalan, nomor rumah, RT/RW, gedung, lantai"></textarea>
      </div>
    </div>
    
    <div class="form-group">
      <label class="form-label">Catatan untuk kurir <span class="optional">(opsional)</span></label>
      <div class="input-wrapper">
        <input type="text" class="form-input" placeholder="Contoh: warna pagar, patokan rumah">
      </div>
    </div>
  </div>
</section>
<section id="section-preferences">
  <div class="preferences-container">
    <div class="toggle-info">
      <div class="toggle-title">Jadikan alamat utama</div>
      <div class="toggle-desc">Hadiah akan dikirim ke alamat ini</div>
    </div>
    <label class="toggle-switch">
      <input type="checkbox" class="toggle-input" checked>
      <span class="toggle-track"></span>
      <span class="toggle-thumb"></span>
    </label>
  </div>
</section>
<section id="section-footer">
  <div class="footer-container">
    <button class="btn-primary">Simpan Alamat</button>
  </div>
</section>
</body>
</html>
