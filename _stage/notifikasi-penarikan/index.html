<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generated Page</title>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
  <style id="sections-styles">
/* CSS for section section:Notification */
.screen-container {
    width: 100%;
    max-width: 412px; /* Based on Figma root frame width */
    min-height: 100vh;
    background-color: #131313;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    box-sizing: border-box;
    position: relative;
  }

  .modal-card {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 312px;
    padding: 20px;
    border-radius: 20px;
    background: linear-gradient(135deg, #1d3350 0%, #14263d 100%);
    box-sizing: border-box;
  }

  .modal-header {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 12px;
  }

  .icon-container {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 40px;
    height: 40px;
    border-radius: 20px;
    background: linear-gradient(135deg, #f5f8fb 0%, #c9d4e1 100%);
    flex-shrink: 0;
  }

  .icon-svg {
    width: 18px;
    height: 18px;
    display: block;
  }

  .title-container {
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .modal-title {
    color: #ffffff;
    font-size: 16px;
    font-weight: 700;
    margin: 0;
    line-height: 1.4;
  }

  .modal-body {
    display: flex;
    flex-direction: column;
    width: 100%;
  }

  .modal-text {
    color: #a0aab5; /* Slightly muted text for better hierarchy */
    font-size: 14px;
    line-height: 1.5;
    margin: 0;
  }

  .modal-text strong {
    color: #ffffff;
    font-weight: 700;
  }

  .modal-footer {
    display: flex;
    flex-direction: row;
    justify-content: flex-end;
    padding-top: 4px;
    width: 100%;
  }

  .btn-close {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 36px;
    padding: 0 22px;
    border-radius: 18px;
    background: linear-gradient(135deg, #f5f8fb 0%, #c9d4e1 100%);
    color: #0c1a2d;
    font-size: 14px;
    font-weight: 700;
    border: none;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.2s ease;
  }

  .btn-close:hover {
    opacity: 0.9;
  }
  </style>
  <script src="global.js" defer></script>
</head>
<body>
<section id="section-notification" class="screen-container">
  <div class="modal-card">
    <div class="modal-header">
      <div class="icon-container">
        <img src="images/40_131.svg" alt="Processing Icon" class="icon-svg">
      </div>
      <div class="title-container">
        <h2 class="modal-title">Penarikan Sedang Diproses</h2>
      </div>
    </div>
    
    <div class="modal-body">
      <p class="modal-text">
        Penarikan sebesar <strong>1.000.000 IDR</strong> sedang diproses. Silakan pantau statusnya di <strong>Riwayat Penarikan</strong> hingga penarikan berhasil.
      </p>
    </div>
    
    <div class="modal-footer">
      <button class="btn-close">Tutup</button>
    </div>
  </div>
</section>
</body>
</html>
