<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generated Page</title>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
  <style id="sections-styles">
/* CSS for section section:Notification */
#section-notification {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    width: 100%;
  }
  .screen-container {
    width: 100%;
    max-width: 412px;
    height: 100vh;
    max-height: 917px;
    position: relative;
    overflow: hidden;
    background-color: #ffffff;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.1);
  }
  @media (max-width: 412px) {
    .screen-container {
      height: 100vh;
      max-height: none;
      box-shadow: none;
    }
  }
  .screen-background {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: 
      radial-gradient(circle at 60% 38%, rgba(44, 72, 104, 0.45) 0%, rgba(44, 72, 104, 0) 100%),
      radial-gradient(circle at 69% -4%, rgba(78, 108, 142, 0.55) 0%, rgba(78, 108, 142, 0) 100%),
      linear-gradient(180deg, #0c1a2d 0%, #13263d 38%, #0f2036 70%, #0a1626 100%);
  }
  .overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(4, 9, 18, 0.85);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
  }
  .modal {
    background: linear-gradient(135deg, #1d3350 0%, #14263d 100%);
    border-radius: 20px;
    padding: 20px;
    width: 100%;
    max-width: 364px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .modal-header {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .icon-container {
    width: 40px;
    height: 40px;
    border-radius: 20px;
    background: linear-gradient(180deg, #f5f8fb 0%, #c9d4e1 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-shrink: 0;
  }
  .icon {
    width: 18px;
    height: 18px;
    display: block;
  }
  .title-container {
    display: flex;
    flex-direction: column;
  }
  .title {
    color: #ffffff;
    font-size: 16px;
    font-weight: 700;
    margin: 0;
    line-height: 1.2;
  }
  .modal-body {
    display: flex;
    flex-direction: column;
  }
  .description {
    color: #a9b7c8;
    font-size: 14px;
    line-height: 1.4;
    margin: 0;
  }
  .modal-footer {
    display: flex;
    justify-content: flex-end;
    padding-top: 4px;
  }
  .btn-close {
    background: linear-gradient(180deg, #f5f8fb 0%, #c9d4e1 100%);
    border-radius: 18px;
    height: 36px;
    padding: 0 22px;
    border: none;
    color: #0c1a2d;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.2s ease;
  }
  .btn-close:hover {
    opacity: 0.9;
  }
  </style>
  <script src="global.js" defer></script>
</head>
<body>
<section id="section-notification">
  <div class="screen-container">
    <div class="screen-background"></div>
    <div class="overlay">
      <div class="modal">
        <div class="modal-header">
          <div class="icon-container">
            <img src="images/8_1046.svg" alt="Info Icon" class="icon">
          </div>
          <div class="title-container">
            <h2 class="title">Judul Notifikasi</h2>
          </div>
        </div>
        <div class="modal-body">
          <p class="description">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore.</p>
        </div>
        <div class="modal-footer">
          <button class="btn-close">Tutup</button>
        </div>
      </div>
    </div>
  </div>
</section>
</body>
</html>
