<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generated Page</title>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
  <style id="sections-styles">
/* CSS for section section:ConfirmationModal */
.modal-overlay {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    background-color: #111111;
  }

  .modal-card {
    width: 100%;
    max-width: 320px;
    background: 
      radial-gradient(100% 100% at 50% 0%, rgba(127, 170, 230, 0.22) 0%, rgba(127, 170, 230, 0) 100%),
      linear-gradient(180deg, #24426A 0%, #1A3150 55%, #12233A 100%);
    border-radius: 24px;
    padding: 22px 20px 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
  }

  .modal-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }

  .modal-title {
    font-size: 16px;
    font-weight: 700;
    color: #ffffff;
    margin: 0 0 4px 0;
    text-align: center;
  }

  .modal-subtitle {
    font-size: 12px;
    color: #a9b7c8;
    text-align: center;
    margin: 0;
    line-height: 1.5;
  }

  .modal-amount-section {
    margin-top: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }

  .amount-label {
    font-size: 12px;
    color: #a9b7c8;
    margin-bottom: 5px;
  }

  .amount-value-wrapper {
    display: flex;
    align-items: baseline;
    gap: 4px;
  }

  .amount-value {
    font-size: 28px;
    font-weight: 700;
    color: #ffffff;
    line-height: 1.2;
  }

  .amount-currency {
    font-size: 12px;
    font-weight: 700;
    color: #a9b7c8;
  }

  .modal-details {
    width: 100%;
    margin-top: 16px;
    display: flex;
    flex-direction: column;
  }

  .detail-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 11px 0;
    border-bottom: 1px solid rgba(201, 212, 225, 0.18);
  }

  .detail-row:last-child {
    border-bottom: none;
  }

  .detail-label {
    font-size: 12px;
    color: #a9b7c8;
  }

  .detail-value {
    font-size: 12px;
    font-weight: 600;
    color: #ffffff;
    text-align: right;
  }

  .text-green {
    color: #3ecf8e;
  }

  .modal-actions {
    width: 100%;
    margin-top: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .btn-primary {
    width: 100%;
    height: 44px;
    border-radius: 22px;
    background: linear-gradient(180deg, #F5F8FB 0%, #C9D4E1 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    color: #0c1a2d;
    font-size: 14px;
    font-weight: 700;
    text-decoration: none;
    transition: opacity 0.2s ease;
  }

  .btn-primary:active, .btn-primary:hover {
    opacity: 0.9;
  }

  .btn-secondary {
    margin-top: 12px;
    color: #a9b7c8;
    font-size: 12px;
    font-weight: 500;
    text-decoration: none;
    padding: 4px 8px;
    transition: color 0.2s ease;
  }

  .btn-secondary:active, .btn-secondary:hover {
    color: #ffffff;
  }
  </style>
  <script src="global.js" defer></script>
</head>
<body>
<section id="confirmation-modal" class="modal-overlay">
  <div class="modal-card">
    <div class="modal-header">
      <h2 class="modal-title">Konfirmasi Holding</h2>
      <p class="modal-subtitle">Pastikan data di bawah ini sudah benar sebelum<br>melanjutkan.</p>
    </div>

    <div class="modal-amount-section">
      <div class="amount-label">Nominal holding</div>
      <div class="amount-value-wrapper">
        <span class="amount-value">1.000.000</span>
        <span class="amount-currency">IDR</span>
      </div>
    </div>

    <div class="modal-details">
      <div class="detail-row">
        <span class="detail-label">Produk</span>
        <span class="detail-value">USDT · Steady Returns</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Periode</span>
        <span class="detail-value">Fleksibel</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Est. APR</span>
        <span class="detail-value text-green">8,50%</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Estimasi imbal hasil / hari</span>
        <span class="detail-value text-green">233 IDR</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Mulai dapat imbal hasil</span>
        <span class="detail-value">26-10-2026</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Dipotong dari</span>
        <span class="detail-value">Saldo Isi Ulang</span>
      </div>
    </div>

    <div class="modal-actions">
      <a href="#" class="btn-primary">Ya, Mulai Holding</a>
      <a href="#" class="btn-secondary">Batal</a>
    </div>
  </div>
</section>
</body>
</html>
