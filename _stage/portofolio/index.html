<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generated Page</title>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
  <style id="sections-styles">
/* CSS for section section:PortfolioPopup */
#section-portfolio-popup {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    padding: 20px;
  }

  .portfolio-card {
    width: 100%;
    max-width: 320px;
    background: radial-gradient(circle at 72% 0%, rgba(127, 170, 230, 0.22) 0%, rgba(127, 170, 230, 0) 100%),
                linear-gradient(135deg, #24426a 0%, #1a3050 55%, #12233a 100%);
    border-radius: 24px;
    padding: 22px 20px 18px 20px;
    display: flex;
    flex-direction: column;
  }

  .card-header {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .title {
    font-size: 16px;
    font-weight: 600;
    color: #ffffff;
    line-height: 1.5;
  }

  .subtitle {
    font-size: 12px;
    color: #a9b7c8;
    margin-top: 4px;
  }

  .chart-section {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 14px;
    margin-top: 18px;
  }

  .chart-image {
    width: 130px;
    height: 98px;
    display: block;
  }

  .chart-legend {
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
  }

  .legend-item {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 8px;
    font-size: 12px;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 4px;
    flex-shrink: 0;
  }

  .dot-stablecoin {
    background: linear-gradient(135deg, #f5f8fb 0%, #a7b5c7 100%);
  }

  .dot-terkunci {
    background: linear-gradient(135deg, #6ff0b4 0%, #1c8a5c 100%);
  }

  .dot-fleksibel {
    background: linear-gradient(135deg, #8fb4ea 0%, #2c4c80 100%);
  }

  .legend-label {
    color: #d3dce7;
    flex: 1;
  }

  .legend-value {
    color: #d3dce7;
    font-weight: 400;
  }

  .details-section {
    display: flex;
    flex-direction: column;
    margin-top: 16px;
  }

  .detail-row {
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
    padding: 11px 0;
    border-top: 1px solid rgba(201, 212, 225, 0.18);
    font-size: 12px;
  }

  .detail-label {
    color: #a9b7c8;
  }

  .detail-value {
    color: #ffffff;
    font-weight: 600;
  }

  .detail-value.highlight {
    color: #3ecf8e;
  }

  .card-footer {
    display: flex;
    justify-content: flex-end;
    margin-top: 14px;
  }

  .btn-close {
    background: linear-gradient(to right, #f5f8fb 0%, #c9d4e1 100%);
    color: #0c1a2d;
    border: none;
    border-radius: 18px;
    height: 36px;
    padding: 0 22px;
    font-size: 12px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.2s ease;
  }

  .btn-close:hover {
    opacity: 0.9;
  }
  </style>
</head>
<body>
<section id="section-portfolio-popup">
  <div class="portfolio-card">
    <header class="card-header">
      <h2 class="title">Portofolio</h2>
      <p class="subtitle">Ringkasan holding kamu saat ini</p>
    </header>

    <div class="chart-section">
      <img src="images/68_1118.svg" alt="Portfolio Chart" class="chart-image">
      <div class="chart-legend">
        <div class="legend-item">
          <div class="dot dot-stablecoin"></div>
          <span class="legend-label">Stablecoin</span>
          <span class="legend-value">50%</span>
        </div>
        <div class="legend-item">
          <div class="dot dot-terkunci"></div>
          <span class="legend-label">Terkunci</span>
          <span class="legend-value">33,3%</span>
        </div>
        <div class="legend-item">
          <div class="dot dot-fleksibel"></div>
          <span class="legend-label">Fleksibel</span>
          <span class="legend-value">16,7%</span>
        </div>
      </div>
    </div>

    <div class="details-section">
      <div class="detail-row">
        <span class="detail-label">Total di-holding</span>
        <span class="detail-value">3.000.000 IDR</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Stablecoin</span>
        <span class="detail-value">1.500.000 IDR</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Terkunci</span>
        <span class="detail-value">1.000.000 IDR</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Fleksibel</span>
        <span class="detail-value">500.000 IDR</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Total imbal hasil</span>
        <span class="detail-value highlight">+184.250 IDR</span>
      </div>
    </div>

    <footer class="card-footer">
      <button class="btn-close">Tutup</button>
    </footer>
  </div>
</section>
</body>
</html>
