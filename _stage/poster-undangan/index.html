<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generated Page</title>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
  <style id="sections-styles">
/* CSS for section section:Header */
.header {
    text-align: center;
    padding: 40px 0 24px 0;
  }
  .header h1 {
    font-size: 14px;
    font-weight: 600;
    color: #ffffff;
  }

/* CSS for section section:Card */
.invite-card {
    background: radial-gradient(circle at top right, rgba(120, 150, 190, 0.45) 0%, transparent 60%), 
                linear-gradient(145deg, #2c4c80 0%, #1a3150 50%, #0f1f35 100%);
    border: 1px solid rgba(201, 212, 225, 0.25);
    border-radius: 20px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    box-sizing: border-box;
  }
  .card-content {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card-logo {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    margin-bottom: 4px;
  }
  .card-title {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.3;
    color: #ffffff;
  }
  .card-subtitle {
    font-size: 12px;
    line-height: 1.5;
    color: #a9b7c8;
  }
  .card-image-wrapper {
    width: 100%;
    display: flex;
    justify-content: center;
    margin-top: 12px;
  }
  .card-image {
    width: 100%;
    max-width: 212px;
    height: auto;
    object-fit: contain;
  }
  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 20px;
    border-top: 1px dashed rgba(201, 212, 225, 0.25);
  }
  .invite-info {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .info-label {
    font-size: 10px;
    color: #a9b7c8;
  }
  .info-code {
    font-size: 20px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 1px;
  }
  .info-instruction {
    font-size: 10px;
    color: #8597ab;
  }
  .qr-container {
    background-color: #f5f8fb;
    border-radius: 10px;
    width: 72px;
    height: 72px;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-shrink: 0;
  }
  .qr-box {
    width: 60px;
    height: 60px;
    border: 1px dashed #8597ab;
    border-radius: 4px;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .qr-text {
    font-size: 11px;
    font-weight: 600;
    color: #51657e;
  }

/* CSS for section section:Actions */
#section-actions {
    margin-top: 24px;
  }
  .actions-container {
    display: flex;
    gap: 10px;
    width: 100%;
  }
  .btn {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    height: 44px;
    border-radius: 22px;
    font-size: 14px;
    font-weight: 600;
    transition: opacity 0.2s ease;
  }
  .btn:active {
    opacity: 0.8;
  }
  .btn-icon {
    width: 16px;
    height: 16px;
  }
  .btn-save {
    background-color: #1f3048;
    color: #e6ecf3;
  }
  .btn-share {
    background: linear-gradient(180deg, #f5f8fb 0%, #c9d4e1 100%);
    color: #0c1a2d;
  }

/* CSS for section section:Footer */
#section-footer {
    margin-top: 24px;
    margin-bottom: 40px;
  }
  .footer {
    text-align: center;
    width: 100%;
  }
  .btn-close {
    color: #a9b7c8;
    font-size: 14px;
    font-weight: 500;
    padding: 8px 16px;
    transition: color 0.2s ease;
  }
  .btn-close:active {
    color: #ffffff;
  }
  </style>
  <script src="global.js" defer></script>
</head>
<body>
<section id="section-header">
  <header class="header">
    <h1>Poster Undangan</h1>
  </header>
</section>
<section id="section-card">
  <div class="invite-card">
    <div class="card-content">
      <img src="images/baa3015660a50107cbaea23d3e4ca9f97c83664c.png" alt="PasarCrypto Logo" class="card-logo">
      <h2 class="card-title">Ajak teman,<br>dapat bonus poin</h2>
      <p class="card-subtitle">Daftar pakai kode di bawah dan mulai<br>trading kripto bersama.</p>
      <div class="card-image-wrapper">
        <img src="images/ceb657af0b93470dfa41714f6ecf1f0518ffb064.png" alt="Crypto Coins" class="card-image">
      </div>
    </div>
    <div class="card-footer">
      <div class="invite-info">
        <span class="info-label">Kode undangan</span>
        <span class="info-code">KNZ8F2</span>
        <span class="info-instruction">Pindai QR untuk daftar</span>
      </div>
      <div class="qr-container">
        <div class="qr-box">
          <span class="qr-text">QR</span>
        </div>
      </div>
    </div>
  </div>
</section>
<section id="section-actions">
  <div class="actions-container">
    <button class="btn btn-save">
      <img src="images/52_609.svg" alt="Save Icon" class="btn-icon">
      <span>Simpan</span>
    </button>
    <button class="btn btn-share">
      <img src="images/52_614.svg" alt="Share Icon" class="btn-icon">
      <span>Bagikan</span>
    </button>
  </div>
</section>
<section id="section-footer">
  <footer class="footer">
    <button class="btn-close">Tutup</button>
  </footer>
</section>
</body>
</html>
