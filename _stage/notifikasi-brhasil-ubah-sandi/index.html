<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generated Page</title>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
  <style id="sections-styles">
/* CSS for section section:Modal */
.modal-section {
  width: 100%;
  max-width: 412px;
  height: 100vh;
  max-height: 917px;
  position: relative;
  overflow: hidden;
  background-color: #ffffff;
  display: flex;
  flex-direction: column;
}

.background-layer {
  position: absolute;
  inset: 0;
  background: 
    radial-gradient(circle at 60% 38%, rgba(44, 72, 104, 0.45) 0%, transparent 70%), 
    radial-gradient(circle at 69% 0%, rgba(78, 108, 142, 0.55) 0%, transparent 70%), 
    linear-gradient(160deg, #0c1a2d 0%, #13263d 38%, #0f2036 70%, #0a1626 100%);
  z-index: 1;
}

.overlay {
  position: absolute;
  inset: 0;
  background-color: rgba(4, 9, 18, 0.85);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 0 24px;
  z-index: 2;
}

.modal-box {
  width: 100%;
  max-width: 364px;
  background: linear-gradient(140deg, #1d3350 0%, #14263d 100%);
  border-radius: 20px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.modal-header {
  display: flex;
  align-items: center;
  gap: 12px;
}

.icon-container {
  width: 40px;
  height: 40px;
  border-radius: 20px;
  background: linear-gradient(135deg, #f5f8fb 0%, #c9d4e1 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  flex-shrink: 0;
}

.success-icon {
  width: 18px;
  height: 18px;
  display: block;
}

.title-container {
  display: flex;
  flex-direction: column;
}

.modal-title {
  color: #ffffff;
  font-size: 16px;
  font-weight: 700;
  margin: 0;
  line-height: 1.4;
}

.modal-body {
  display: flex;
  flex-direction: column;
}

.modal-text {
  color: #a9b7c8;
  font-size: 14px;
  font-weight: 400;
  margin: 0;
  line-height: 1.5;
}

.modal-footer {
  display: flex;
  justify-content: flex-end;
  padding-top: 4px;
}

.btn-close {
  height: 36px;
  padding: 0 22px;
  border-radius: 18px;
  background: linear-gradient(135deg, #f5f8fb 0%, #c9d4e1 100%);
  border: none;
  color: #0c1a2d;
  font-size: 14px;
  font-weight: 600;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  display: flex;
  justify-content: center;
  align-items: center;
  transition: opacity 0.2s ease;
}

.btn-close:hover {
  opacity: 0.9;
}
  </style>
</head>
<body>
<section id="section-modal" class="modal-section">
  <div class="background-layer"></div>
  <div class="overlay">
    <div class="modal-box">
      <div class="modal-header">
        <div class="icon-container">
          <img src="images/8_1009.svg" alt="Success" class="success-icon">
        </div>
        <div class="title-container">
          <h2 class="modal-title">Kata Sandi Diperbarui</h2>
        </div>
      </div>
      <div class="modal-body">
        <p class="modal-text">Kata sandimu sudah diperbarui. Silakan masuk kembali menggunakan kata sandi yang baru.</p>
      </div>
      <div class="modal-footer">
        <button class="btn-close">Tutup</button>
      </div>
    </div>
  </div>
</section>
</body>
</html>
