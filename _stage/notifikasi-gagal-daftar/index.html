<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generated Page</title>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
  <style id="sections-styles">
/* CSS for section section:Modal */
#section-modal {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  width: 100%;
}

.screen-container {
  position: relative;
  width: 100%;
  max-width: 412px;
  height: 100vh;
  max-height: 917px;
  background: linear-gradient(180deg, #0c1a2d 0%, #13263d 38%, #0f2036 70%, #0a1626 100%);
  overflow: hidden;
  box-shadow: 0 4px 24px rgba(0, 0, 0, 0.1);
}

.overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(4, 9, 18, 0.85);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 24px;
}

.modal-card {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  max-width: 364px;
  padding: 20px;
  border-radius: 20px;
  background: linear-gradient(180deg, #1d3350 0%, #14263d 100%);
}

.modal-header {
  display: flex;
  align-items: center;
  gap: 12px;
}

.icon-wrapper {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 40px;
  height: 40px;
  border-radius: 20px;
  background: linear-gradient(180deg, #f5f8fb 0%, #c9d4e1 100%);
  flex-shrink: 0;
}

.icon {
  width: 18px;
  height: 18px;
  display: block;
}

.modal-title {
  color: #ffffff;
  font-size: 16px;
  font-weight: 700;
  margin: 0;
  line-height: 1.4;
}

.modal-body {
  display: flex;
  flex-direction: column;
}

.modal-description {
  color: #a9b7c8;
  font-size: 14px;
  line-height: 1.5;
  margin: 0;
}

.modal-footer {
  display: flex;
  justify-content: flex-end;
  padding-top: 4px;
}

.btn-close {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 36px;
  padding: 0 22px;
  border-radius: 18px;
  background: linear-gradient(180deg, #f5f8fb 0%, #c9d4e1 100%);
  border: none;
  cursor: pointer;
  color: #0c1a2d;
  font-size: 14px;
  font-weight: 700;
  font-family: inherit;
  transition: opacity 0.2s ease;
}

.btn-close:hover {
  opacity: 0.9;
}
  </style>
  <script src="global.js" defer></script>
</head>
<body>
<section id="section-modal">
  <div class="screen-container">
    <div class="overlay">
      <div class="modal-card">
        <div class="modal-header">
          <div class="icon-wrapper">
            <img src="images/8_937.svg" alt="Error Icon" class="icon">
          </div>
          <h2 class="modal-title">Pendaftaran Gagal</h2>
        </div>
        <div class="modal-body">
          <p class="modal-description">Maaf, pendaftaranmu belum berhasil diproses. Periksa kembali data yang kamu isi, lalu coba lagi.</p>
        </div>
        <div class="modal-footer">
          <button class="btn-close">Tutup</button>
        </div>
      </div>
    </div>
  </div>
</section>
</body>
</html>
