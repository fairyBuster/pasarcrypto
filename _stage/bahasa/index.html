<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generated Page</title>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
  <style id="sections-styles">
/* CSS for section section:Header */
.app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 16px 0;
  }
  .back-btn {
    width: 40px;
    height: 40px;
    border-radius: 20px;
    background-color: #1f3048;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
  }
  .page-title {
    color: #ffffff;
    font-size: 16px;
    font-weight: 600;
    margin: 0;
    flex: 1;
    text-align: center;
  }
  .header-spacer {
    width: 40px;
  }

/* CSS for section section:Description */
.desc-container {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 20px 16px 18px;
  }
  .desc-icon {
    margin-top: 2px;
    width: 16px;
    height: 16px;
  }
  .desc-text {
    color: #a9b7c8;
    font-size: 14px;
    line-height: 1.3;
    margin: 0;
  }

/* CSS for section section:LanguageOptions */
.options-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 0 16px;
  }
  
  .lang-option {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.2s ease;
    background-color: rgba(31, 48, 72, 0.55);
    border: 1px solid #2a3d56;
  }
  
  .lang-option.selected,
  .lang-option:has(input:checked) {
    background: linear-gradient(135deg, #24426a 0%, #1a3150 55%, #12233a 100%);
    border: 1px solid #8fa1b6;
  }

  .lang-icon {
    width: 40px;
    height: 40px;
    border-radius: 20px;
    background-color: rgba(0, 0, 0, 0.22);
    border: 1px solid rgba(201, 212, 225, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #e6ecf3;
    font-size: 14px;
    font-weight: 600;
  }

  .lang-text {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .lang-main {
    color: #ffffff;
    font-size: 15px;
    font-weight: 500;
  }

  .lang-sub {
    color: #8597ab;
    font-size: 13px;
  }

  .lang-radio {
    width: 22px;
    height: 22px;
    border-radius: 11px;
    border: 1px solid #51657e;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .lang-option.selected .lang-radio,
  .lang-option:has(input:checked) .lang-radio {
    background: linear-gradient(180deg, #f5f8fb 0%, #c9d4e1 100%);
    border: none;
  }
  
  .lang-radio img {
    width: 12px;
    height: 12px;
  }

/* CSS for section section:Action */
.action-container {
    padding: 24px 16px;
  }
  .btn-save {
    width: 100%;
    height: 44px;
    border-radius: 22px;
    background: linear-gradient(180deg, #f5f8fb 0%, #c9d4e1 100%);
    color: #0c1a2d;
    font-size: 15px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.2s;
  }
  .btn-save:active {
    opacity: 0.8;
  }
  </style>
  <script src="global.js" defer></script>
</head>
<body>
<section id="section-header">
  <header class="app-header">
    <button class="back-btn" aria-label="Go back">
      <img src="images/94_541.svg" alt="">
    </button>
    <h1 class="page-title">Bahasa</h1>
    <div class="header-spacer"></div>
  </header>
</section>
<section id="section-description">
  <div class="desc-container">
    <img src="images/94_549.svg" alt="" class="desc-icon">
    <p class="desc-text">Pilih bahasa yang ingin kamu gunakan di aplikasi.</p>
  </div>
</section>
<section id="section-options">
  <div class="options-list">
    <!-- Selected Option -->
    <label class="lang-option selected">
      <input type="radio" name="language" value="id" checked class="sr-only">
      <div class="lang-icon">ID</div>
      <div class="lang-text">
        <span class="lang-main">Bahasa Indonesia</span>
        <span class="lang-sub">Indonesian</span>
      </div>
      <div class="lang-radio checked">
        <img src="images/94_564.svg" alt="">
      </div>
    </label>

    <!-- Unselected Option 1 -->
    <label class="lang-option">
      <input type="radio" name="language" value="en" class="sr-only">
      <div class="lang-icon">EN</div>
      <div class="lang-text">
        <span class="lang-main">English</span>
        <span class="lang-sub">Bahasa Inggris</span>
      </div>
      <div class="lang-radio"></div>
    </label>

    <!-- Unselected Option 2 -->
    <label class="lang-option">
      <input type="radio" name="language" value="zh" class="sr-only">
      <div class="lang-icon">中</div>
      <div class="lang-text">
        <span class="lang-main">简体中文</span>
        <span class="lang-sub">Bahasa Mandarin</span>
      </div>
      <div class="lang-radio"></div>
    </label>
  </div>
</section>
<section id="section-action">
  <div class="action-container">
    <button class="btn-save">Simpan</button>
  </div>
</section>
</body>
</html>
