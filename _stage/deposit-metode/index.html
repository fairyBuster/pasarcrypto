<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generated Page</title>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
  <style id="sections-styles">
/* CSS for section section:Header */
.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 16px 0 16px;
    height: 60px;
}
.back-btn {
    width: 40px;
    height: 40px;
    border-radius: 20px;
    background-color: #1f3048;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
}
.back-btn img {
    width: 20px;
    height: 20px;
}
.page-title {
    font-size: 16px;
    font-weight: 600;
}
.header-spacer {
    width: 40px;
    height: 40px;
}

/* CSS for section section:History */
.history-container {
    padding: 18px 16px 0 16px;
}
.history-btn {
    display: flex;
    align-items: center;
    background-color: #16263c;
    border-radius: 16px;
    padding: 14px;
    gap: 12px;
    transition: background-color 0.2s ease;
}
.history-btn:active {
    background-color: #1a2d47;
}
.history-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background-color: #24364e;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}
.history-icon img {
    width: 18px;
    height: 18px;
}
.history-text {
    flex: 1;
    font-size: 14px;
    font-weight: 500;
}
.arrow-icon {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
}

/* CSS for section section:PaymentMethods */
.method-group {
    display: flex;
    flex-direction: column;
}
.section-title {
    font-size: 14px;
    font-weight: 600;
    padding: 24px 16px 10px 16px;
}
.list-container {
    padding: 0 16px;
}
.list-item {
    display: flex;
    align-items: center;
    background: linear-gradient(180deg, #1c2e46 0%, #16273d 100%);
    border-radius: 18px;
    padding: 14px;
    gap: 12px;
    transition: filter 0.2s ease;
}
.list-item:active {
    filter: brightness(1.2);
}
.provider-logo {
    object-fit: contain;
    flex-shrink: 0;
}
.qris-logo {
    width: 61px;
    height: 28px;
}
.bri-logo {
    width: 35px;
    height: 34px;
    border-radius: 4px;
}
.provider-name {
    flex: 1;
    font-size: 14px;
    font-weight: 500;
}
.badge {
    background-color: rgba(90, 130, 191, 0.22);
    border-radius: 12px;
    padding: 4px 10px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.badge span {
    color: #9fc0ec;
    font-size: 12px;
    font-weight: 500;
}

/* CSS for section section:SecurityBanner */
.security-container {
    padding: 16px 16px 0 16px;
}
.security-banner {
    background: linear-gradient(135deg, #1d3656 0%, #162a44 100%);
    border-radius: 16px;
    display: flex;
    align-items: center;
    padding: 16px 16px 16px 100px;
    position: relative;
    min-height: 91px;
    margin-top: 6px;
}
.security-img {
    width: 74px;
    height: 97px;
    position: absolute;
    left: 16px;
    bottom: 0;
    object-fit: contain;
    z-index: 1;
}
.security-text {
    display: flex;
    flex-direction: column;
    gap: 4px;
    position: relative;
    z-index: 2;
}
.security-text h3 {
    font-size: 12px;
    font-weight: 600;
}
.security-text p {
    font-size: 10px;
    color: #a9b7c8;
    line-height: 1.4;
}
  </style>
  <script src="global.js" defer></script>
</head>
<body>
<section id="section-header">
    <header class="header">
        <button class="back-btn" aria-label="Go back">
            <img src="images/29_71.svg" alt="">
        </button>
        <h1 class="page-title">Setor IDR</h1>
        <div class="header-spacer"></div>
    </header>
</section>
<section id="section-history">
    <div class="history-container">
        <a href="#" class="history-btn">
            <div class="history-icon">
                <img src="images/29_79.svg" alt="">
            </div>
            <span class="history-text">Riwayat Pembayaran</span>
            <img src="images/29_84.svg" alt="" class="arrow-icon">
        </a>
    </div>
</section>
<section id="section-payment-methods">
    <div class="method-group">
        <h2 class="section-title">QRIS</h2>
        <div class="list-container">
            <a href="#" class="list-item">
                <img src="images/d37fb3edfd5dece82fadde7eb47c981eba1097e0.png" alt="QRIS" class="provider-logo qris-logo">
                <span class="provider-name">QRIS</span>
                <div class="badge">
                    <span>Instan</span>
                </div>
                <img src="images/29_98.svg" alt="" class="arrow-icon">
            </a>
        </div>
    </div>

    <div class="method-group">
        <h2 class="section-title">Virtual Account</h2>
        <div class="list-container">
            <a href="#" class="list-item">
                <img src="images/90ed915a6a3ba553f860d7c765ef8380cc2a96e0.png" alt="BRI" class="provider-logo bri-logo">
                <span class="provider-name">BRI</span>
                <div class="badge">
                    <span>Instan</span>
                </div>
                <img src="images/29_112.svg" alt="" class="arrow-icon">
            </a>
        </div>
    </div>
</section>
<section id="section-security">
    <div class="security-container">
        <div class="security-banner">
            <img src="images/9e084c1e66c50a13dd89f5e20ace83590121dc6b.png" alt="" class="security-img">
            <div class="security-text">
                <h3>Pembayaran aman & terlindungi</h3>
                <p>Diproses oleh mitra pembayaran pihak ketiga resmi. Data dan transaksimu terenkripsi.</p>
            </div>
        </div>
    </div>
</section>
</body>
</html>
