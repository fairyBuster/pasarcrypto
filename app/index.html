    <meta property="og:site_name" content="PasarCrypto" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:title" content="PasarCrypto — Pasar Kripto &amp; Produk Digital" />
    <meta
      property="og:description"
      content="Pasar aset kripto dan produk digital: pantau harga, kelola aset, ikuti program referral, dan belajar kripto dari dasar."
    />
    <meta property="og:url" content="https://pasarcryptoid.com/" />
    <meta property="og:image" content="https://pasarcryptoid.com/assets/img/baa3015660.png" />
    <meta property="og:image:width" content="2000" />
    <meta property="og:image:height" content="2000" />
    <meta property="og:image:alt" content="Logo PasarCrypto" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="PasarCrypto — Pasar Kripto &amp; Produk Digital" />
    <meta
      name="twitter:description"
      content="Pasar aset kripto dan produk digital: pantau harga, kelola aset, ikuti program referral, dan belajar kripto dari dasar."
    />
    <meta name="twitter:image" content="https://pasarcryptoid.com/assets/img/baa3015660.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "PasarCrypto",
        "alternateName": "Pasar Crypto",
        "url": "https://pasarcryptoid.com/",
        "description": "Pasar aset kripto dan produk digital: pantau harga, kelola aset, ikuti program referral, dan belajar kripto dari dasar.",
        "inLanguage": "id-ID"
      }
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- a crawler without JavaScript still gets a description of the product
         instead of an empty document -->
    <noscript>
      <h1>PasarCrypto</h1>
      <p>
        Pasar aset kripto dan produk digital: pantau harga pasar, kelola aset, ikuti program
        referral, dan pelajari kripto dari dasar. Aktifkan JavaScript untuk membuka aplikasi, atau
        mulai dari <a href="/landing">halaman utama PasarCrypto</a>.
      </p>
    </noscript>
    <script>
      // a cached index can point at an entry chunk a deploy already replaced;
      // if the app still has not booted shortly after load, fetch a fresh index
      // once (the query defeats cached HTML) instead of showing a blank page
      (function () {
        window.__pscrypBoot = false;
        setTimeout(function () {
          if (window.__pscrypBoot) return;
          var url = new URL(window.location.href);
          if (url.searchParams.has('fresh')) return;
          url.searchParams.set('fresh', String(Date.now()));
          window.location.replace(url.toString());
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
