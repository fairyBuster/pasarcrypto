<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PasarCrypto</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // a cached index can point at an entry chunk a deploy already replaced;
      // if the app still has not booted shortly after load, fetch a fresh index
      // once (the query defeats cached HTML) instead of showing a blank page
      (function () {
        window.__pscrypBoot = false;
        setTimeout(function () {
          if (window.__pscrypBoot) return;
          var url = new URL(window.location.href);
          if (url.searchParams.has('fresh')) return;
          url.searchParams.set('fresh', String(Date.now()));
          window.location.replace(url.toString());
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
