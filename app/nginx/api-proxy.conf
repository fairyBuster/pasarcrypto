# Shared by every proxy that talks to API_UPSTREAM (http or https).
proxy_http_version 1.1;
proxy_set_header Host $api_host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# API_UPSTREAM may be an https domain: send SNI and verify the certificate
proxy_ssl_server_name on;
proxy_ssl_name $api_host;
proxy_ssl_verify on;
# 2026 Let's Encrypt chains add an extra cross-signed CA layer
proxy_ssl_verify_depth 3;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

# fail in 10s instead of the 60s default when the backend is down
proxy_connect_timeout 10s;
